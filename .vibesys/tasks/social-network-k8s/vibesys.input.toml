version = 1
backends = ["cpu"]

[agent]
domain = "microservices"

[environment]
needs = ["kubernetes"]

# The check and the benchmark are the trusted wrapper run.py. It reads
# KUBECONFIG, VIBESYS_K8S_REGISTRY and VIBESYS_K8S_BUILDER from the environment.
# A cold build of the C++ services takes most of the first job's time.
[accuracy]
command = ["python3", ".vibesys/tasks/social-network-k8s/run.py", "check", "--project-root", "${PROJECT_ROOT}"]
timeout_seconds = 2700

[benchmark]
command = ["python3", ".vibesys/tasks/social-network-k8s/run.py", "benchmark", "--project-root", "${PROJECT_ROOT}"]
timeout_seconds = 2700
result_protocol = 2
