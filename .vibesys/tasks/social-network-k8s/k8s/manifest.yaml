apiVersion: v1
kind: Service
metadata:
  name: nginx-thrift
  labels:
    app: nginx-thrift
spec:
  type: ClusterIP
  selector:
    app: nginx-thrift
  ports:
  - name: p8080
    port: 8080
    targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-thrift
  labels:
    app: nginx-thrift
    tier: app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx-thrift
  template:
    metadata:
      labels:
        app: nginx-thrift
        tier: app
    spec:
      terminationGracePeriodSeconds: 5
      enableServiceLinks: false
      containers:
      - name: nginx-thrift
        image: ${SOCIAL_NETWORK_IMAGE}
        imagePullPolicy: IfNotPresent
        command: ["/usr/local/bin/nginx-thrift"]
        env:
        - name: fqdn_suffix
          value: ".${NAMESPACE}.svc.cluster.local"
        resources:
          requests: {cpu: "1", memory: 2Gi}
          limits: {cpu: "1", memory: 2Gi}
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet: {path: /, port: 8080}
          periodSeconds: 2
          failureThreshold: 150
        volumeMounts:
        - name: jaeger-config
          mountPath: /usr/local/openresty/nginx/jaeger-config.json
          subPath: jaeger-config.json
      volumes:
      - name: jaeger-config
        configMap:
          name: jaeger-config
