# Task-owned deployment of DeathStarBench Social Network for social-network-k8s.
# run.py substitutes ${NAMESPACE} and ${SOCIAL_NETWORK_IMAGE} (the candidate image
# built from socialNetwork/) and applies the data tier (tier: data) before the
# application (tier: app). Replica counts, resources and the data tier are the
# task's; the code, nginx.conf, Lua scripts and service-config.json come from
# the candidate image. Every container has requests == limits.
---
# Tracing is the task's: every hop reports spans to the task's jaeger at a fixed
# sampling ratio (per-hop latency comes from these traces).
apiVersion: v1
kind: ConfigMap
metadata:
  name: jaeger-config
data:
  jaeger-config.yml: |
    disabled: false
    reporter:
      logSpans: false
      localAgentHostPort: "jaeger:6831"
      queueSize: 1000000
      bufferFlushInterval: 10
    sampler:
      type: "probabilistic"
      param: 0.01
  jaeger-config.json: |
    {
      "service_name": "nginx-web-server",
      "disabled": false,
      "reporter": {
        "logSpans": false,
        "localAgentHostPort": "jaeger:6831",
        "queueSize": 1000000,
        "bufferFlushInterval": 10
      },
      "sampler": {
        "type": "probabilistic",
        "param": 0.01
      }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  labels:
    app: jaeger
spec:
  type: ClusterIP
  selector:
    app: jaeger
  ports:
  - name: p6831
    port: 6831
    targetPort: 6831
    protocol: UDP
  - name: p6832
    port: 6832
    targetPort: 6832
    protocol: UDP
  - name: p5778
    port: 5778
    targetPort: 5778
  - name: p16686
    port: 16686
    targetPort: 16686
  - name: p14268
    port: 14268
    targetPort: 14268
  - name: p14269
    port: 14269
    targetPort: 14269
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  labels:
    app: jaeger
    tier: data
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
        tier: data
    spec:
      terminationGracePeriodSeconds: 5
      enableServiceLinks: false
      containers:
      - name: jaeger
        image: docker.io/jaegertracing/all-in-one:1.57@sha256:8f165334f418ca53691ce358c19b4244226ed35c5d18408c5acf305af2065fb9
        imagePullPolicy: IfNotPresent
        args: ["--memory.max-traces=100000"]
        resources:
          requests: {cpu: "2", memory: 2Gi}
          limits: {cpu: "2", memory: 2Gi}
        ports:
        - containerPort: 6831
          protocol: UDP
        - containerPort: 16686
        - containerPort: 14269
        readinessProbe:
          httpGet: {path: /, port: 14269}
          periodSeconds: 2
          failureThreshold: 60
---
apiVersion: v1
kind: Service
metadata:
  name: post-storage-mongodb
  labels:
    app: post-storage-mongodb
spec:
  type: ClusterIP
  selector:
    app: post-storage-mongodb
  ports:
  - name: p27017
    port: 27017
    targetPort: 27017
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: post-storage-mongodb
  labels:
    app: post-storage-mongodb
    tier: data
spec:
  replicas: 1
  selector:
    matchLabels:
      app: post-storage-mongodb
  template:
    metadata:
      labels:
        app: post-storage-mongodb
        tier: data
    spec:
      terminationGracePeriodSeconds: 5
      enableServiceLinks: false
      containers:
      - name: mongodb
        image: docker.io/library/mongo:4.4.6@sha256:6efa052039903e731e4a5550c68a13c4869ddc93742c716332883fd9c77eb79b
        imagePullPolicy: IfNotPresent
        args: ["--bind_ip_all", "--wiredTigerCacheSizeGB", "2"]
        resources:
          requests: {cpu: "2", memory: 4Gi}
          limits: {cpu: "2", memory: 4Gi}
        ports:
        - containerPort: 27017
        readinessProbe:
          exec:
            command: ["mongo", "--quiet", "--eval", "db.adminCommand('ping').ok"]
          periodSeconds: 2
          timeoutSeconds: 5
          failureThreshold: 90
        volumeMounts:
        - name: data
          mountPath: /data/db
      volumes:
      - name: data
        emptyDir: {}
