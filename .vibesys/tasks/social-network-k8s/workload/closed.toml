version = 1
# Development seeds; run.py passes fresh --seed/--fixture-seed per sample.
name = "social-network-k8s-closed-loop"
application = "social-network"

[load]
model = "closed_loop"
rate = 0
duration_seconds = 20
warmup_seconds = 10
concurrency = 32
timeout_seconds = 10
repetitions = 2
seed = 48
fixture_seed = 48
min_offered_rate_ratio = 0.95

[[targets]]
name = "gateway"
protocol = "http"
address = "http://nginx-thrift:8080"
session_policy = "reuse"

# 50% user-timeline reads, 40% home-timeline reads, 10% compose with
# read-your-write, plus 1% follow/unfollow (weights sum to 1010).
[[operations]]
name = "user_timeline_read"
target = "gateway"
weight = 500
tags = ["read"]

[[operations]]
name = "home_timeline_read"
target = "gateway"
weight = 400
tags = ["read"]

[[operations]]
name = "compose_post"
target = "gateway"
weight = 100
tags = ["write", "read-your-write"]

[[operations]]
name = "follow"
target = "gateway"
weight = 5
tags = ["write"]

[[operations]]
name = "unfollow"
target = "gateway"
weight = 5
tags = ["write"]

[application_config]
dataset_seed = 407708418465   # internal/dataset DefaultSeed
freshness_ms = 1000

[objective]
name = "logical_operations_per_second"
metric = "operations_per_second"
direction = "maximize"
unit = "operations/s"

[constraints]
min_success_rate = 1.0
max_error_rate = 0.0
min_operations_per_type = 1
