version = "0.2"
backends = ["cpu"]

[agent]
domain = "microservices"

[environment]
needs = ["kubernetes"]

# Both commands run the trusted task code baked into the task image at /task, on
# vibesys-evaluator; they read KUBECONFIG, VIBESYS_K8S_REGISTRY and VIBESYS_K8S_BUILDER from the
# environment. Both are bench.py's: the accuracy check (vibesys-evaluator's accuracy run: phases
# of the accuracy workload with every answer captured, faults between them, then the Go oracle
# on the history; exit 0 PASS, 1 FAIL, 2 UNKNOWN) and the benchmark (one sample per run).
# The timeouts cover a job that finds no data snapshot on the node and waits for its first
# build (about 25 minutes; snapshot.py).
[accuracy]
command = ["python", "/task/bench.py", "accuracy", "--project-root", "${PROJECT_ROOT}"]
timeout_seconds = 6000

[benchmark]
command = ["python", "/task/bench.py", "benchmark", "--project-root", "${PROJECT_ROOT}"]
timeout_seconds = 5400
result_protocol = 2
