# The application tier of the reference (base) topology: eight Deployments of two pods,
# 1 CPU and 2 GiB each (16 CPUs, 32 GiB), and the Services of the seven gRPC services.
# The candidate owns its own copy, hotelReservation/deploy/app.yaml (OBJECTIVE.md,
# Resources); this one is used for a candidate that has none. Moved verbatim from
# k8s/manifest.yaml, which keeps the data tier, the ConfigMaps and the frontend Service.
---
# Source: hotel-reservation/charts/geo/templates/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: geo
spec:
  type: ClusterIP
  ports:
  - name: "8083"
    port: 8083
    targetPort: 8083
  selector:
    app.kubernetes.io/name: geo
    app.kubernetes.io/instance: hotel
    service: geo

