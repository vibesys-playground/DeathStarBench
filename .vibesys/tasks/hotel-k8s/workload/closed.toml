version = 1
name = "hotel-k8s-closed-loop"
application = "hotel"

[load]
model = "closed_loop"
rate = 0
duration_seconds = 20
warmup_seconds = 10
concurrency = 32
timeout_seconds = 10
repetitions = 2
seed = 48
fixture_seed = 48
min_offered_rate_ratio = 0.95

# The oracle (which runs this workload) requires a burst of concurrent
# reservations of one night to accept exactly the rooms left; the load
# generator ignores it.
[application_config]
strict_linearizable_capacity = true

[[targets]]
name = "gateway"
protocol = "http"
address = "http://frontend:5000"
session_policy = "reuse"

[[operations]]
name = "search_hotels"
target = "gateway"
weight = 6000
tags = ["read", "search"]

[[operations]]
name = "recommend_distance"
target = "gateway"
weight = 1300
tags = ["read", "recommendation"]

[[operations]]
name = "recommend_rate"
target = "gateway"
weight = 1300
tags = ["read", "recommendation"]

[[operations]]
name = "recommend_price"
target = "gateway"
weight = 1300
tags = ["read", "recommendation"]

[[operations]]
name = "login_valid"
target = "gateway"
weight = 30
tags = ["read", "authentication"]

[[operations]]
name = "login_invalid"
target = "gateway"
weight = 20
tags = ["read", "authentication"]

[[operations]]
name = "reserve_capacity"
target = "gateway"
weight = 50
tags = ["write", "read-your-write"]

[[operations]]
name = "hotel_rates"
target = "gateway"
weight = 400
tags = ["read", "rates"]

# Admin writes, about 1% of the mix (see evaluator/internal/apps/hotel/writes.go).
[[operations]]
name = "update_rate"
target = "gateway"
weight = 42
tags = ["write", "admin"]

[[operations]]
name = "update_profile"
target = "gateway"
weight = 42
tags = ["write", "admin"]

[[operations]]
name = "set_capacity"
target = "gateway"
weight = 12
tags = ["write", "admin", "read-your-write"]

[[operations]]
name = "add_hotel"
target = "gateway"
weight = 8
tags = ["write", "admin"]

[objective]
name = "logical_operations_per_second"
metric = "operations_per_second"
direction = "maximize"
unit = "operations/s"

[constraints]
min_success_rate = 1.0
max_error_rate = 0.0
min_operations_per_type = 1
