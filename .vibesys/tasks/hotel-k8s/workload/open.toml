version = 1
# fixture_seed differs from closed.toml: both phases run in one namespace, and the
# application has no way to delete reservations, so the phases need disjoint dates.
name = "hotel-k8s-open-loop"
application = "hotel"

[load]
model = "open_loop"
rate = 670
duration_seconds = 40
warmup_seconds = 10
concurrency = 512
timeout_seconds = 10
repetitions = 2
seed = 48
fixture_seed = 49
min_offered_rate_ratio = 0.95

[[targets]]
name = "gateway"
protocol = "http"
address = "http://frontend:5000"
session_policy = "reuse"

[[operations]]
name = "search_hotels"
target = "gateway"
weight = 600
tags = ["read", "search"]

[[operations]]
name = "recommend_distance"
target = "gateway"
weight = 130
tags = ["read", "recommendation"]

[[operations]]
name = "recommend_rate"
target = "gateway"
weight = 130
tags = ["read", "recommendation"]

[[operations]]
name = "recommend_price"
target = "gateway"
weight = 130
tags = ["read", "recommendation"]

[[operations]]
name = "login_valid"
target = "gateway"
weight = 3
tags = ["read", "authentication"]

[[operations]]
name = "login_invalid"
target = "gateway"
weight = 2
tags = ["read", "authentication"]

[[operations]]
name = "reserve_capacity"
target = "gateway"
weight = 5
tags = ["write", "read-your-write"]

[objective]
name = "p99_latency_ms"
metric = "latency_ms.p99"
direction = "minimize"
unit = "ms"

[constraints]
min_success_rate = 1.0
max_error_rate = 0.0
min_operations_per_type = 1
