version = 1
name = "hotel-k8s-open-loop"
application = "hotel"

[load]
model = "open_loop"
rate = 670   # placeholder: run.py passes --rate = 0.7 x this sample's closed-loop throughput
duration_seconds = 60
warmup_seconds = 10
concurrency = 512
timeout_seconds = 10
repetitions = 3
# Fixed seeds for local development only: run.py passes fresh --seed and
# --fixture-seed to every phase of every sample (seeds.json in its artifacts),
# the open phase's fixture seed being the closed phase's plus 1, so the two
# phases (one namespace, reservations cannot be deleted) own disjoint fixtures.
seed = 48
fixture_seed = 49
min_offered_rate_ratio = 0.95

[[targets]]
name = "gateway"
protocol = "http"
address = "http://frontend:5000"
session_policy = "reuse"

[[operations]]
name = "search_hotels"
target = "gateway"
weight = 6000
tags = ["read", "search"]

[[operations]]
name = "recommend_distance"
target = "gateway"
weight = 1300
tags = ["read", "recommendation"]

[[operations]]
name = "recommend_rate"
target = "gateway"
weight = 1300
tags = ["read", "recommendation"]

[[operations]]
name = "recommend_price"
target = "gateway"
weight = 1300
tags = ["read", "recommendation"]

[[operations]]
name = "login_valid"
target = "gateway"
weight = 30
tags = ["read", "authentication"]

[[operations]]
name = "login_invalid"
target = "gateway"
weight = 20
tags = ["read", "authentication"]

[[operations]]
name = "reserve_capacity"
target = "gateway"
weight = 50
tags = ["write", "read-your-write"]

[[operations]]
name = "hotel_rates"
target = "gateway"
weight = 400
tags = ["read", "rates"]

# Admin writes, about 1% of the mix (see evaluator/internal/apps/hotel/writes.go).
[[operations]]
name = "update_rate"
target = "gateway"
weight = 42
tags = ["write", "admin"]

[[operations]]
name = "update_profile"
target = "gateway"
weight = 42
tags = ["write", "admin"]

[[operations]]
name = "set_capacity"
target = "gateway"
weight = 12
tags = ["write", "admin", "read-your-write"]

[[operations]]
name = "add_hotel"
target = "gateway"
weight = 8
tags = ["write", "admin"]

[objective]
name = "p99_latency_ms"
metric = "latency_ms.p99"
direction = "minimize"
unit = "ms"

[constraints]
min_success_rate = 1.0
max_error_rate = 0.0
min_operations_per_type = 1
