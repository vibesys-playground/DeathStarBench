# A regrouped application tier within the envelope (tests): frontend as web (3 x 2 CPU),
# search, geo and rate in one pod (2 x 2 CPU), the rest smaller: 15 CPUs, 5.5 GiB.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    helm.sh/chart: frontend-0.1.0
    app.kubernetes.io/name: frontend
    app.kubernetes.io/instance: hotel
    app.kubernetes.io/version: 0.1.0
    app.kubernetes.io/managed-by: Helm
    service: frontend
  name: web
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
      app.kubernetes.io/instance: hotel
      service: frontend
      app: web
  template:
    metadata:
      labels:
        helm.sh/chart: frontend-0.1.0
        app.kubernetes.io/name: frontend
        app.kubernetes.io/instance: hotel
        app.kubernetes.io/version: 0.1.0
        app.kubernetes.io/managed-by: Helm
        service: frontend
        app: web
    spec:
      containers:
      - name: hotel-reserv-frontend
        image: ${HOTEL_IMAGE}
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            cpu: '2'
            memory: 512Mi
          limits:
            cpu: '2'
            memory: 512Mi
        ports:
        - containerPort: 5000
        env:
        - name: GOMAXPROCS
          valueFrom:
            resourceFieldRef:
              resource: limits.cpu
              divisor: '1'
        - name: GC
          value: '100'
        - name: JAEGER_SAMPLE_RATIO
          value: '0.01'
        - name: LOG_LEVEL
          value: INFO
        - name: MEMC_TIMEOUT
          value: '2'
        - name: TLS
          value: '0'
        command:
        - /go/bin/frontend
        volumeMounts:
        - name: frontend-config
          mountPath: /workspace/config.json
          subPath: service-config.json
      volumes:
      - name: frontend-config
        configMap:
          name: frontend
      hostname: frontend
      restartPolicy: Always
      terminationGracePeriodSeconds: 5
      affinity: {}
      tolerations: []
      nodeSelector: {}
---
