version = 1

[agent]
domain = "microservices"

[evaluator]
name = "vibesys-evaluator-microservice"
version = "0.1.0"

[accuracy]
entrypoint = "servicebench"
args = [
  "--mode", "accuracy",
  "--workload", "${PROJECT_ROOT}/.vibesys/tasks/hotel-reservation/benchmark/workload.toml",
  "--seed", "random",
  "--candidate-dir", "${PROJECT_ROOT}/hotelReservation",
  "--run-command-json", "[\"docker\",\"compose\",\"up\",\"-d\",\"--build\"]",
  "--stop-command-json", "[\"docker\",\"compose\",\"stop\",\"-t\",\"10\",\"frontend\",\"geo\",\"profile\",\"rate\",\"recommendation\",\"reservation\",\"search\",\"user\"]",
  "--cleanup-command-json", "[\"docker\",\"compose\",\"down\",\"-v\",\"--remove-orphans\"]",
  "--startup-timeout", "120",
]
timeout_seconds = 300

[benchmark]
entrypoint = "servicebench"
args = [
  "trace",
  "--workload", "${PROJECT_ROOT}/.vibesys/tasks/hotel-reservation/benchmark/workload.toml",
  "--seed", "random",
  "--fixture-seed", "random",
  "--candidate-dir", "${PROJECT_ROOT}/hotelReservation",
  "--run-command-json", "[\"sh\",\"-c\",\"rm -f /tmp/vibesys-hotel-reservation/otel/traces.otlp.ndjson && go -C ${PACKAGE_ROOT} run ./cmd/otelinject --compose ${PROJECT_ROOT}/hotelReservation/docker-compose.yml --config ${PROJECT_ROOT}/.vibesys/tasks/hotel-reservation/benchmark/otel/telemetry.toml --metrics-dir /tmp/vibesys-hotel-reservation/otel --output /tmp/vibesys-hotel-reservation/otel/compose.telemetry.yaml && docker compose -f ${PROJECT_ROOT}/hotelReservation/docker-compose.yml -f /tmp/vibesys-hotel-reservation/otel/compose.telemetry.yaml up -d --build\"]",
  "--stop-command-json", "[\"docker\",\"compose\",\"stop\",\"-t\",\"10\",\"frontend\",\"geo\",\"profile\",\"rate\",\"recommendation\",\"reservation\",\"search\",\"user\"]",
  "--cleanup-command-json", "[\"docker\",\"compose\",\"down\",\"-v\",\"--remove-orphans\"]",
  "--startup-timeout", "120",
  "--telemetry-command-json", "[\"go\",\"-C\",\"${PACKAGE_ROOT}\",\"run\",\"./cmd/otelcapture\",\"--input-json\",\"/tmp/vibesys-hotel-reservation/otel/traces.otlp.ndjson\",\"--settle-seconds\",\"5\"]",
  "--telemetry-output", "/tmp/vibesys-hotel-reservation/otel/telemetry.json",
  "--trace-graph-json", "/tmp/vibesys-hotel-reservation/otel/trace-graph.json",
  "--telemetry-timeout", "60",
]
timeout_seconds = 360

[benchmark.result]
json_argument = "--output-json"
metric = "primary_value"
