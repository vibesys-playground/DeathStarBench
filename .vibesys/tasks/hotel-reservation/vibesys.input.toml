version = 1

[agent]
domain = "microservices"

[evaluator]
name = "vibesys-evaluator-microservice"
version = "0.1.0"

[accuracy]
entrypoint = "servicebench"
args = [
  "--mode", "accuracy",
  "--workload", "${PROJECT_ROOT}/.vibesys/tasks/hotel-reservation/benchmark/workload.toml",
  "--seed", "random",
  "--candidate-dir", "${PROJECT_ROOT}/hotelReservation",
  "--run-command-json", "[\"docker\",\"compose\",\"up\",\"-d\",\"--build\"]",
  "--stop-command-json", "[\"docker\",\"compose\",\"stop\",\"-t\",\"10\",\"frontend\",\"geo\",\"profile\",\"rate\",\"recommendation\",\"reservation\",\"search\",\"user\"]",
  "--cleanup-command-json", "[\"docker\",\"compose\",\"down\",\"-v\",\"--remove-orphans\"]",
  "--startup-timeout", "120",
]
timeout_seconds = 300

[benchmark]
entrypoint = "servicebench"
args = [
  "trace",
  "--workload", "${PROJECT_ROOT}/.vibesys/tasks/hotel-reservation/benchmark/workload.toml",
  "--seed", "random",
  "--fixture-seed", "random",
  "--candidate-dir", "${PROJECT_ROOT}/hotelReservation",
  "--run-command-json", "[\"sh\",\"-c\",\"rm -f ../.vibesys/state/local/hotel-reservation/otel/traces.otlp.ndjson && python -m vibesys.evaluators --package vibesys-evaluator-microservice --version 0.1.0 --digest sha256:36a0341f3ce718dbabcc57c0eaee28d18211adb3cf80dc432ec9780d7ca2d0a7 --entrypoint otelinject -- --compose docker-compose.yml --config ../.vibesys/tasks/hotel-reservation/benchmark/otel/telemetry.toml --metrics-dir ../.vibesys/state/local/hotel-reservation/otel --output ../.vibesys/state/local/hotel-reservation/otel/compose.telemetry.yaml && docker compose -f docker-compose.yml -f ../.vibesys/state/local/hotel-reservation/otel/compose.telemetry.yaml up -d --build\"]",
  "--stop-command-json", "[\"docker\",\"compose\",\"stop\",\"-t\",\"10\",\"frontend\",\"geo\",\"profile\",\"rate\",\"recommendation\",\"reservation\",\"search\",\"user\"]",
  "--cleanup-command-json", "[\"docker\",\"compose\",\"down\",\"-v\",\"--remove-orphans\"]",
  "--startup-timeout", "120",
  "--telemetry-command-json", "[\"python\",\"-m\",\"vibesys.evaluators\",\"--package\",\"vibesys-evaluator-microservice\",\"--version\",\"0.1.0\",\"--digest\",\"sha256:36a0341f3ce718dbabcc57c0eaee28d18211adb3cf80dc432ec9780d7ca2d0a7\",\"--entrypoint\",\"otelcapture\",\"--\",\"--input-json\",\".vibesys/state/local/hotel-reservation/otel/traces.otlp.ndjson\",\"--settle-seconds\",\"5\"]",
  "--telemetry-output", ".vibesys/state/local/hotel-reservation/otel/telemetry.json",
  "--trace-graph-json", ".vibesys/state/local/hotel-reservation/otel/trace-graph.json",
  "--telemetry-timeout", "60",
]
timeout_seconds = 360

[benchmark.result]
json_argument = "--output-json"
metric = "primary_value"
