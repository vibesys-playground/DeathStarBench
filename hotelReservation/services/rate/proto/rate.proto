syntax = "proto3";

package rate;

option go_package = "github.com/delimitrou/DeathStarBench/tree/master/hotelReservation/services/rate";

service Rate {
  // GetRates returns rate codes for hotels for a given date range
  rpc GetRates(Request) returns (Result);
  // UpdateRate sets the prices of one rate plan of a hotel (NOT_FOUND if the
  // hotel has no plan with that code).
  rpc UpdateRate(UpdateRateRequest) returns (UpdateRateResult);
  // AddRates stores the rate plans of a new hotel.
  rpc AddRates(AddRatesRequest) returns (AddRatesResult);
}

message Request {
  repeated string hotelIds = 1;
  string inDate = 2;
  string outDate = 3;
}

message Result {
  repeated RatePlan ratePlans = 1;
}

message RatePlan {
  string hotelId = 1;
  string code = 2;
  string inDate = 3;
  string outDate = 4;
  RoomType roomType = 5;
}

message RoomType {
  double bookableRate = 1;
  double totalRate = 2;
  double totalRateInclusive = 3;
  string code = 4;
  string currency = 5;
  string roomDescription = 6;
}

message UpdateRateRequest {
  string hotelId = 1;
  string code = 2;
  double bookableRate = 3;
  double totalRate = 4;
  double totalRateInclusive = 5;
}

message UpdateRateResult {}

message AddRatesRequest {
  repeated RatePlan ratePlans = 1;
}

message AddRatesResult {}
